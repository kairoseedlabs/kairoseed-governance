[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairoseed-governance"
version = "0.1.0"
description = "Verification-first governance architecture for agentic AI execution."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8.0,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kairoseed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/kairoseed"]

[tool.coverage.run]
branch = true
source = ["kairoseed"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
