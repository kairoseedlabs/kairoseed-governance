apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: govana-require-runtime-default-seccomp
  annotations:
    policies.kyverno.io/title: Require RuntimeDefault seccomp
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-runtime-default-seccomp
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Pod seccompProfile.type must be RuntimeDefault or Localhost."
        anyPattern:
          - spec:
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
          - spec:
              securityContext:
                seccompProfile:
                  type: Localhost
