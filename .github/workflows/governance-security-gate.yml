name: KAIROSEED Governance Security Gate

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Governance Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5-line
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install verification dependencies
        run: python -m pip install -e ".[dev]"

      - name: Static analysis
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
          mypy src/kairoseed

      - name: Run fail-closed regression suite
        run: |
          pytest \
            --cov=kairoseed \
            --cov-branch \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: Enforce C0 invariant
        run: pytest tests/test_c0.py tests/test_governance.py --strict-markers --maxfail=1 -q

  kcs02-parity:
    name: KCS-0.2 Cross-Language Parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5-line
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Configure Node
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4-line
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: kairoseed/kcs02-ts/package-lock.json

      - name: Install locked Python dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Install locked TypeScript dependencies
        working-directory: kairoseed/kcs02-ts
        run: npm ci --ignore-scripts

      - name: Run Python compliance tests
        run: |
          python -m pytest \
            tests/test_kcs02_compliance.py \
            tests/test_kcs02_replay.py \
            --strict-markers \
            --maxfail=1 \
            -q

      - name: Compile TypeScript
        working-directory: kairoseed/kcs02-ts
        run: npm run build

      - name: Produce Python vector results
        run: |
          python tests/run_python_vectors.py \
            --vectors tests/golden_vectors.json \
            --output /tmp/kcs02-python-results.json

      - name: Produce TypeScript vector results
        run: |
          node kairoseed/kcs02-ts/dist/vector-runner.js \
            --vectors tests/golden_vectors.json \
            --output /tmp/kcs02-typescript-results.json

      - name: Enforce exact cross-language parity
        run: |
          python tests/compare_kcs02_vectors.py \
            --vectors tests/golden_vectors.json \
            --python-results /tmp/kcs02-python-results.json \
            --typescript-results /tmp/kcs02-typescript-results.json

  fail-closed-gate:
    name: PASS or BLOCK
    if: always()
    needs: [verification, kcs02-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate governance decision
        env:
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          PARITY_RESULT: ${{ needs.kcs02-parity.result }}
        run: |
          set -eu
          if [ "$VERIFICATION_RESULT" = "success" ] && [ "$PARITY_RESULT" = "success" ]; then
            echo "KAIROSEED GOVERNANCE DECISION: PASS"
            echo "All required verification controls passed."
          else
            echo "KAIROSEED GOVERNANCE DECISION: BLOCK"
            echo "Invariant: ¬PASS ⇒ ¬EFFECT"
            exit 1
          fi
