name: KCS-0.2 Cross-Language Parity

on:
  pull_request:
    paths:
      - "kairoseed/kcs02/**"
      - "kairoseed/kcs02-ts/**"
      - "tests/golden_vectors.json"
      - "tests/run_python_vectors.py"
      - "tests/compare_kcs02_vectors.py"
      - "tests/test_kcs02_*.py"
      - "requirements-ci.txt"
      - ".github/workflows/kcs02-parity.yml"
  push:
    branches:
      - main
    paths:
      - "kairoseed/kcs02/**"
      - "kairoseed/kcs02-ts/**"
      - "tests/**"
      - "requirements-ci.txt"
      - ".github/workflows/kcs02-parity.yml"

permissions:
  contents: read

concurrency:
  group: kcs02-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Python == TypeScript == Golden
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      NODE_ENV: "test"
      CI: "true"

    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # reviewed v5-line commit
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Configure Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # reviewed v4-line commit
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: kairoseed/kcs02-ts/package-lock.json

      - name: Install locked Python dependencies
        run: |
          python -m pip install --require-hashes \
            -r requirements-ci.txt

      - name: Install locked TypeScript dependencies
        working-directory: kairoseed/kcs02-ts
        run: npm ci --ignore-scripts

      - name: Run Python compliance tests
        run: |
          python -m pytest \
            tests/test_kcs02_compliance.py \
            tests/test_kcs02_replay.py \
            --strict-markers \
            --maxfail=1 \
            -q

      - name: Compile TypeScript
        working-directory: kairoseed/kcs02-ts
        run: npm run build

      - name: Produce Python vector results
        run: |
          python tests/run_python_vectors.py \
            --vectors tests/golden_vectors.json \
            --output /tmp/kcs02-python-results.json

      - name: Produce TypeScript vector results
        run: |
          node kairoseed/kcs02-ts/dist/vector-runner.js \
            --vectors tests/golden_vectors.json \
            --output /tmp/kcs02-typescript-results.json

      - name: Enforce exact cross-language parity
        run: |
          python tests/compare_kcs02_vectors.py \
            --vectors tests/golden_vectors.json \
            --python-results /tmp/kcs02-python-results.json \
            --typescript-results /tmp/kcs02-typescript-results.json
