name: apply-ruff-format

on:
  push:
    branches: ["ci/fail-closed-verification-contract"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fail-closed-verification-contract
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install --quiet -e ".[dev]"
      - name: Apply Ruff compliance fixes
        run: |
          ruff check --fix src tests examples
          ruff format src tests examples
      - name: Commit generated changes
        run: |
          if git diff --quiet -- src tests examples; then
            echo "No Ruff changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests examples
          git commit -m "style: apply Ruff check and format"
          git push origin HEAD:ci/fail-closed-verification-contract
