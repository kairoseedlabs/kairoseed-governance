apiVersion: v1
kind: Pod
metadata:
  name: govana-mutable-image
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: ghcr.io/your-org/govana-core:v1.1.0
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests: {cpu: 200m, memory: 256Mi}
        limits: {cpu: "1", memory: 1Gi}
